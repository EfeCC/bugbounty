# ═══════════════════════════════════════════════════════════
# bugtool — Konfigürasyon
# ═══════════════════════════════════════════════════════════

# ── Binary Yolları (opsiyonel) ──────────────────────────────
# Kali'de Python httpx CLI, ProjectDiscovery (PD) httpx ile çakışabilir.
# Çakışma varsa Go binary'sinin TAM YOLUNU buraya yaz; boş = PATH'ten ara.
# `which -a httpx` ile hangi httpx'lerin kurulu olduğunu görebilirsin.
binaries:
  httpx: "/home/efe/go/bin/httpx"   # Kali: apt httpx-toolkit = ProjectDiscovery Go sürümü
                                    # /usr/bin/httpx Python CLI'dır, YANLIŞ — kullanma!
  # subfinder: ""
  # dnsx: ""
  # nuclei: ""
  # katana: ""
  # gau: ""
  # ffuf: ""


# ── Kapsam (Scope) ─────────────────────────────────────────
# Domain wildcard desteklenir: `*.example.com` → apex + tüm subdomain eşleşir.
scope:
  # OTOMATİK KAPSAM: yazdığın hedef (hunt/recon/triage --active) o çalışma için
  # otomatik izinli sayılır (`*.<hedef-host>`). Böylece her yeni site için scope.txt'i
  # elle değiştirmen gerekmez — X'e test yaptıktan sonra Y'ye geçmek için dosyaya
  # dokunmazsın. GÜVENLİK: aşağıdaki `excluded_targets` ve scope.txt'teki `!` girdileri
  # HER ZAMAN önce kontrol edilir ve otomatik izni EZER (carve-out korunur).
  # false yaparsan eski katı davranış: yalnızca scope.txt/allowed_targets taranabilir.
  auto_from_target: true
  # Sadece bunlar taranabilir (otomatik kapsama EK olarak; boş bırakabilirsin)
  allowed_targets: []
  # Bu hedefler ASLA taranmaz (otomatik izni de ezer)
  excluded_targets: []
  # Program scope'unu harici dosyadan yükle. auto_from_target açıkken bu dosya OPSİYONEL:
  # sadece belirli host'ları kısıtlamak/hariç tutmak (`!admin.example.com`) istersen doldur.
  # Satır formatı: `example.com` / `*.example.com` = izinli; `!admin.example.com` = yasak.
  scope_file: "scope.txt"

# ── Web Recon (DETERMİNİSTİK, LLM YOK) ─────────────────────
# Aşamalar: subfinder+crt.sh → dnsx → takeover → httpx → git/cors → (katana+gau+ffuf)
#           → secrets → nuclei. Binary/bağımlılık yoksa aşama SESSİZCE atlanır.
webrecon:
  passive_only: false          # true = aktif crawl (katana) + ffuf kapalı; sadece pasif kaynaklar
  # DOS VDP: "avoid disruption to production systems" + DoS kesin yasak → NAZİK ayarlar.
  rate_limit: 50                # httpx/nuclei/ffuf istek/sn üst sınırı (varsayılan 150'den düşürüldü)
  concurrency: 10               # httpx/gau/ffuf paralel thread (varsayılan 25'ten düşürüldü)
  nuclei_severity: "low,medium,high,critical"
  max_urls: 3000
  timeout: 600                 # subfinder/nuclei gibi TÜM tarama için üst sınır (per-istek DEĞİL)
  # Per-host kontroller (git/cors/secret/apischema) — çok subdomain'de tek tek dakikalarca
  # donmayı önler: KISA istek-timeout'u + paralel çalışma.
  probe_timeout: 8             # tek bir per-host isteğin zaman aşımı (sn) — 600 değil!
  probe_concurrency: 8         # aynı anda kaç host kontrol edilsin (DOS VDP için nazikleştirildi)
  # git/cors/exposures kaç (ÖNCELİKLENDİRİLMİŞ) host'ta koşsun. hostrank host'ları ilginçlik
  # skoruyla sıralar → bu ilk N, keyfi değil "en değerli N"dir. 0 = cap yok (tüm host'lar).
  probe_max_hosts: 150
  # Aşama kapatma. YENİ modüller (ctlogs/takeover/gitcheck/cors/exposures/secrets/apischema)
  # hepsi pasif/düşük-riskli, --active GEREKTİRMEZ, varsayılan AÇIK. Kapatmak için:
  #   {ctlogs: false, takeover: false, gitcheck: false, cors: false, exposures: false,
  #    secrets: false, apischema: false, nuclei: false}
  # ctlogs/gitcheck/cors/exposures/secrets/apischema 'requests' yoksa, takeover 'dnsx' yoksa
  # kendiliğinden atlanır.
  # exposures = nuclei'siz NATIVE yüksek-değerli ifşa/misconfig kontrolü (.env/actuator/phpinfo/
  #   server-status/VCS metadata/telescope/wp-config yedeği…). HER host'ta, saniyeler içinde.
  #   nuclei'nin en çok ürettiği tek-GET bulgularını binlerce şablon denemeden yakalar.
  stages: {}
  secrets_max_files: 40        # secret taraması için indirilecek max JS dosyası (cap)
  # API şema keşfi (Swagger/OpenAPI) — bilinen konumlarda + keşfedilen URL'lerde şema
  # dosyası arar, query+body parametreli endpoint haritası çıkarır (bkz. api_schema.py).
  # Tamamen pasif/GET-only. Body-param'lar --active fuzzer'a BESLENMEZ (henüz POST/JSON
  # body fuzzing desteği yok) — sadece bilgi/triyaj amaçlı, triage çıktısında görünür.
  apischema_max_hosts: 15      # kaç canlı host'ta şema dosyası aransın (patlamayı önler)
  # İçerik keşfi / dizin brute (ffuf) — linklenmemiş /admin, /.git, /backup yollarını bulur
  ffuf_wordlist: ""            # boşsa yaygın SecLists/dirb konumları otomatik denenir
                               # NOT: common.txt (~4600 kelime) önce denenir, raft-small (~43K) son seçenek
  ffuf_max_hosts: 10           # kaç canlı host'ta ffuf koşulsun (patlamayı önler)
  ffuf_codes: "200,204,301,302,307,401,403,405,500"
  ffuf_timeout: 120            # host başına ffuf zaman aşımı (sn)
  # Aktif URL crawl (katana) — endpoint keşfi için web sayfalarını gezer
  katana_max_hosts: 15         # kaç canlı host'ta katana koşulsun (eskiden sınırsız → timeout!)
  katana_crawl_duration: 300   # toplam crawl süresi limiti (sn) — 5dk. Eskiden sınırsız + 600sn timeout'a sığmıyordu
  # Zafiyet taraması (nuclei) — template tabanlı otomatik zaf. tespiti
  # ÖNEMLİ (host önceliklendirme): nuclei artık TÜM canlı host'lara değil, hostrank'ın en umut
  # vaadeden ilk `nuclei_max_hosts` host'una çalışır. 300 host × ~2300 şablon → nuclei_timeout'a
  # çarpıp yarım kesilme sorunu böyle çözülür. Yüksek-değerli ifşa/misconfig bulgularının çoğu
  # zaten native `exposures` aşamasında (HER host'ta, nuclei'siz) toplanıyor — nuclei tamamlayıcı.
  nuclei_max_hosts: 40         # nuclei kaç önceliklendirilmiş host'ta koşsun. 0 = hepsi (eski davranış).
                               # nuclei'yi tamamen kapatmak için: stages: {nuclei: false}
  nuclei_timeout: 1200         # nuclei için AYRI timeout (sn) — 20dk. Eskiden global 600sn → büyük hedeflerde patıyordu
  # DÜZELTME: nuclei filtresiz kurulu template repo'sunun TAMAMINI (binlerce şablon —
  # `nuclei -tl` ile kaç tane kurulu olduğunu görebilirsin) her host'a karşı deniyordu,
  # tek host'ta bile nuclei_timeout'a çarpıp taramanın yarım kesilmesine sebep oluyordu.
  # Çözüm: varsayılan olarak tech-BAĞIMSIZ yüksek-değerli şablon setini çalıştır (aşağıda).
  nuclei_auto_scan: false      # -as: SADECE tespit edilen teknolojiye göre şablon seç. Modern
                               # SPA/API'lerde tech tespiti zayıf → neredeyse hiç şablon çalışmaz,
                               # o yüzden varsayılan KAPALI. WordPress/Jira gibi tech'i belli
                               # hedeflerde açmak isteyebilirsin.
  # Hangi şablonlar çalışsın (virgülle ayrık, `-t` değerleri). Boş bırakırsan TAM tarama
  # (binlerce şablon, yavaş). Varsayılan set: ifşa dosyalar/misconfig/default-login/açık
  # panel/takeover/genel-zafiyet — stack'ten bağımsız, en yüksek sinyal (~2300 şablon).
  # CVE'ler (çoğu ürün-spesifik) bilerek dışarıda; belirli bir ürünü hedefliyorsan
  # "http/cves/" ekleyebilirsin.
  nuclei_templates: "http/exposures/,http/misconfiguration/,http/default-logins/,http/exposed-panels/,http/takeovers/,http/vulnerabilities/,dns/,ssl/"
  nuclei_exclude_tags: "dos,fuzz,intrusive"   # yavaş/riskli kategorileri hariç tut (VDP "no disruption" uyumlu)

# ── Monitor (yeni-asset takibi) ────────────────────────────
monitor:
  baseline_dir: "recon"
  notify: false
  webhook_url: null            # Slack/Teams/generic webhook URL (opsiyonel)
  webhook_format: "generic"    # generic | slack | teams

# ── Aktif Test / Fuzzer (triage --active) ──────────────────
# Parametrelere non-destructive DETECTION payload'ları basar. SCOPE-GATED + opt-in.
# Payload'lar bugtool/payloads.py'de (tek kaynak). Sonuçlar POTANSİYEL — manuel doğrula.
fuzz:
  max_requests: 500            # oturum başına toplam istek üst sınırı (blast-radius)
  delay: 0.3                   # DOS VDP: istekler arası bekleme (nazik olmak için 0'dan artırıldı)
  timeout: 10                  # istek zaman aşımı (sn)
  verify_tls: false            # self-signed sertifikalarda hata verme
  block_threshold: 8           # art arda bu kadar 403/429 gelince backoff (WAF/rate-limit) → dur
  test_all_if_no_hint: true    # true = ipucu olmayan param'da da TÜM sınıfları dene ("ne olursa");
                               # false = sadece xss/sqli/redirect (akıllı bütçe, sınırlı VM için)
  # DOS VDP: "Open redirect - unless additional security impact can be demonstrated" AÇIKÇA
  # kapsam dışı → open_redirect sınıfını fuzz'dan çıkardık (boşuna bulgu/istek üretmesin).
  classes: ["xss", "sqli", "lfi", "ssti", "ssrf", "crlf", "cmdi"]
  # Timing-ladder (doz-yanıt): zaman-tabanlı SQLi/CMDi'yi tek sleep yerine doz merdiveniyle
  # doğrular → ağ gürültüsü FP'sini eler, FIRED/INCONCLUSIVE/NOT_FIRED üretir.
  ladder_doses: [0, 2, 4, 6]   # sleep dozları (sn); yanıt süresi bunlarla doğrusal artmalı
  ladder_rounds: 2             # her doz kaç tur ölçülsün (medyan alınır; artırınca daha sağlam/yavaş)
  # WAF-bypass: kanonik payload WAF'a takılınca (pozitif kontrol) denenecek mutasyon sayısı
  waf_mutations_cap: 6         # sqli/ssti'de encode/yorum/case varyantlarıyla atlatmayı dene
  # ── Path-tabanlı API-probe (query'siz REST endpoint'leri: /api/...) ──
  # --active'de query-param fuzzer'ına EK olarak çalışır. Metot/yetki haritası SADECE
  # OPTIONS+GET (okuma, non-destructive). api_oob_post: bağlantı-test edici (test-connection/
  # callback/oauth/webhook) + yıkıcı-OLMAYAN endpoint'lere JSON body ile kör SSRF probu da
  # gönderilsin mi (yalnızca --oob verildiğinde). false = sadece GET-query OOB probu.
  api_oob_post: true
