# ═══════════════════════════════════════════════════════════
# bugtool — Konfigürasyon
# ═══════════════════════════════════════════════════════════

# ── Kapsam (Scope) ─────────────────────────────────────────
# Domain wildcard desteklenir: `*.example.com` → apex + tüm subdomain eşleşir.
scope:
  # Sadece bunlar taranabilir (boşsa tüm hedefler geçerli)
  allowed_targets: []
  # Bu hedefler ASLA taranmaz
  excluded_targets: []
  # Bug bounty program scope'unu harici dosyadan yükle (bu dosyayı düzenlemeden).
  # Satır formatı: `example.com` / `*.example.com` = izinli; `!admin.example.com` = yasak.
  scope_file: "scope.txt"

# ── Web Recon (DETERMİNİSTİK, LLM YOK) ─────────────────────
# Aşamalar: subfinder+crt.sh → dnsx → takeover → httpx → git/cors → (katana+gau+ffuf)
#           → secrets → nuclei. Binary/bağımlılık yoksa aşama SESSİZCE atlanır.
webrecon:
  passive_only: false          # true = aktif crawl (katana) + ffuf kapalı; sadece pasif kaynaklar
  rate_limit: 150              # httpx/nuclei/ffuf istek/sn üst sınırı (sınırlı VM için düşür: 50)
  concurrency: 25              # httpx/gau/ffuf paralel thread (sınırlı VM için düşür: 10)
  nuclei_severity: "low,medium,high,critical"
  max_urls: 3000
  timeout: 600
  # Aşama kapatma. YENİ modüller (ctlogs/takeover/gitcheck/cors/secrets) hepsi pasif/
  # düşük-riskli, --active GEREKTİRMEZ, varsayılan AÇIK. Kapatmak için:
  #   {ctlogs: false, takeover: false, gitcheck: false, cors: false, secrets: false}
  # ctlogs/gitcheck/cors/secrets 'requests' yoksa, takeover 'dnsx' yoksa kendiliğinden atlanır.
  stages: {}
  secrets_max_files: 40        # secret taraması için indirilecek max JS dosyası (cap)
  # İçerik keşfi / dizin brute (ffuf) — linklenmemiş /admin, /.git, /backup yollarını bulur
  ffuf_wordlist: ""            # boşsa yaygın SecLists/dirb konumları otomatik denenir
  ffuf_max_hosts: 10           # kaç canlı host'ta ffuf koşulsun (patlamayı önler)
  ffuf_codes: "200,204,301,302,307,401,403,405,500"

# ── Monitor (yeni-asset takibi) ────────────────────────────
monitor:
  baseline_dir: "recon"
  notify: false
  webhook_url: null            # Slack/Teams/generic webhook URL (opsiyonel)
  webhook_format: "generic"    # generic | slack | teams

# ── Aktif Test / Fuzzer (triage --active) ──────────────────
# Parametrelere non-destructive DETECTION payload'ları basar. SCOPE-GATED + opt-in.
# Payload'lar bugtool/payloads.py'de (tek kaynak). Sonuçlar POTANSİYEL — manuel doğrula.
fuzz:
  max_requests: 500            # oturum başına toplam istek üst sınırı (blast-radius)
  delay: 0.0                   # istekler arası bekleme (sn) — hedefi yormamak/rate-limit için artır
  timeout: 10                  # istek zaman aşımı (sn)
  verify_tls: false            # self-signed sertifikalarda hata verme
  block_threshold: 8           # art arda bu kadar 403/429 gelince backoff (WAF/rate-limit) → dur
  test_all_if_no_hint: true    # true = ipucu olmayan param'da da TÜM sınıfları dene ("ne olursa");
                               # false = sadece xss/sqli/redirect (akıllı bütçe, sınırlı VM için)
  classes: null                # null = tüm sınıflar; örn ["xss","sqli","lfi"] ile daralt
